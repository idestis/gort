version: 2

# gort's default SCRIPTS_DIR is ./dist, so keep goreleaser's output elsewhere.
dist: .goreleaser-dist

builds:
  - id: gort
    binary: gort
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [freebsd, windows, linux, darwin]
    goarch: [arm64]

archives:
  - id: gort
    ids: [gort]
    # Raw binaries (e.g. gort_2.0.0_linux_arm64), as used by the README's Dockerfile wget.
    formats: [binary]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
