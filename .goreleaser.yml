version: 2

# gort's default SCRIPTS_DIR is ./dist, so keep goreleaser's output elsewhere.
dist: .goreleaser-dist

builds:
  - id: gort
    binary: gort
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [freebsd, windows, linux, darwin]
    goarch: [amd64, arm, arm64]
    goarm: ["6", "7"]
    ignore:
      - { goos: linux, goarch: arm, goarm: "7" }

archives:
  - id: gort
    ids: [gort]
    # Raw binaries (e.g. gort_1.2.1_linux_amd64), as used by the README's Dockerfile wget.
    formats: [binary]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
