name: Release

# Two ways to release:
#   1. Locally:  task release VERSION=1.3.0   (pushes tag v1.3.0, which triggers this workflow)
#   2. From the GitHub UI: Actions -> Release -> "Run workflow", enter 1.3.0
#      (creates the tag on the tip of main and publishes in one run)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.0 (tag v1.3.0 is created on main)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Manual runs always release main, whichever branch the button was pressed on.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Create tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION#v}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version like 1.3.0"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          echo "Tagged $(git rev-parse --short HEAD) as $tag"

      - name: Test
        run: task test

      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so the
      # manual path pushes the tag only after tests pass and publishes in this run.
      - name: Push tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin "v${VERSION#v}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
